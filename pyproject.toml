[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psd-visualiser"
version = "1.0.0"
description = "Interactive celestial-mechanics tools for Part III Planetary System Dynamics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "PySide6>=6.6,<7"]

[project.gui-scripts]
psd-visualiser = "psd_visualiser.app:main"

[tool.setuptools.packages.find]
include = ["psd_visualiser*"]
